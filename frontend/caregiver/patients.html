<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Patients — MedRemind+</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/caregiver.js"></script>
    <script src="../js/notifications.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => { const u = caregiverInit(); if (!u) return; const p = patientForCaregiver(u.id); patients.innerHTML = p ? `<div class="card"><div class="page-head" style="margin-bottom:0"><div><h3>${p.name}</h3><div class="muted">Adherence: ${adherenceFor(p.id)}%</div></div><a class="btn btn-primary" href="patient-details.html?id=${p.id}">View Patient</a></div></div>` : "<div class='card'><p class='muted'>No connected patients.</p></div>"; });
    </script>
</head>

<body>
    <header class="topbar">
        <div class="btn-row"><button class="icon-btn mobile-menu">☰</button><a class="brand"
                href="../caregiver/dashboard.html">MedRemind<span>+</span></a></div>
        <div class="top-actions"><span class="muted" data-user-name></span><button class="btn btn-small"
                onclick="logout()">Logout</button></div>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <div class="nav-title">Caregiver</div>
            <nav class="nav">
                <a href="../caregiver/dashboard.html">Dashboard</a>
                <a href="../caregiver/patients.html">Patients</a>
                <a href="../caregiver/alerts.html">Alerts</a>
                <a href="../caregiver/notifications.html">Notifications</a>
                <a href="../caregiver/reports.html">Reports</a>
                <a href="../caregiver/profile.html">Profile</a>
            </nav>
        </aside>
        <main class="main">
            <div class="page-head">
                <div>
                    <h1>Patients</h1>
                    <div class="muted">Connected patient accounts.</div>
                </div>
            </div>
            <div id="patients"></div>
        </main>
    </div>
    <script>document.addEventListener("DOMContentLoaded", () => { const u = currentUser(); document.querySelectorAll("[data-user-name]").forEach(e => e.textContent = u?.name || ""); });</script>
</body>

</html>
