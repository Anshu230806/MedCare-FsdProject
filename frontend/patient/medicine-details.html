<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medicine Details — MedRemind+</title><link rel="stylesheet" href="../css/style.css"><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/patient.js"></script><script src="../js/reminders.js"></script><script src="../js/notifications.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const u=patientInit();if(!u)return;
 const id=new URLSearchParams(location.search).get("id"); const m=Store.get("medicines",[]).find(x=>x.id===id);
 if(!m){location.href="404.html";return;}
 document.getElementById("editLink").href="medicine-form.html?id="+id;
 const logs=getLogsForPatient(u.id).filter(l=>l.medicineId===id).slice(-8).reverse();
 document.getElementById("details").innerHTML=`<div class="grid grid-2"><div class="card"><img src="${m.image}" class="med-thumb" style="width:100px;height:100px" alt=""><h2>${m.name}</h2><p class="muted">${m.dosage}</p><p>${m.instructions||"No instructions added."}</p><hr style="border:0;border-top:1px solid #e5ece9"><p><strong>Schedule:</strong> ${m.scheduleType==="interval"?`Every ${m.interval.value} ${m.interval.unit}`:`${formatTime(m.time)} daily`}</p><p class="muted">Start: ${m.startDate?formatDate(m.startDate):"Not set"} · End: ${m.endDate?formatDate(m.endDate):"Not set"}</p></div><div class="card"><h3>Dose Activity</h3><div class="timeline">${logs.length?logs.map(l=>`<div class="timeline-item"><div class="timeline-time">${formatDate(l.date)} · Scheduled ${formatTime(l.scheduledTime)}</div><strong>${statusLabel(l.status)}</strong><div class="muted">${l.actualTime?`Recorded at ${formatTime(l.actualTime)}`:"No actual time recorded"}</div></div>`).join(""):"<p class='muted'>No dose history yet.</p>"}</div></div></div>`;
});
</script>
</head><body>
<header class="topbar"><div class="btn-row"><button class="icon-btn mobile-menu">☰</button><a class="brand" href="../patient/dashboard.html">MedRemind<span>+</span></a></div><div class="top-actions"><span class="muted" data-user-name></span><button class="btn btn-small" onclick="logout()">Logout</button></div></header>
<div class="layout"><aside class="sidebar">
    <div class="nav-title">Patient</div>
    <nav class="nav">
      <a href="../patient/dashboard.html">Dashboard</a>
      <a href="../patient/medicines.html">My Medicines</a>
      <a href="../patient/history.html">Medication History</a>
      <a href="../patient/adherence.html">Adherence</a>
      <a href="../patient/notifications.html">Notifications</a>
      <a href="../patient/profile.html">Profile & Settings</a>
    </nav></aside><main class="main">
<div class="page-head"><div><h1 id="title">Medicine Details</h1><div class="muted">Schedule and recent dose activity.</div></div><div class="btn-row"><a id="editLink" class="btn">Edit</a><a class="btn" href="medicines.html">Back</a></div></div>
<div id="details"></div>
</main></div>
<script>document.addEventListener("DOMContentLoaded",()=>{const u=currentUser();document.querySelectorAll("[data-user-name]").forEach(e=>e.textContent=u?.name||"");});</script>
</body></html>
