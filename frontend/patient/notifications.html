<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — MedRemind+</title><link rel="stylesheet" href="../css/style.css"><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/patient.js"></script><script src="../js/reminders.js"></script><script src="../js/notifications.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{const u=patientInit();if(!u)return;function render(){const ns=notificationsFor(u.id);document.getElementById("notes").innerHTML=ns.length?ns.map(n=>`<div class="card" style="${n.read?'':'border-left:3px solid #2c8c78'}"><div style="display:flex;justify-content:space-between;gap:12px"><div><strong>${n.text}</strong><div class="muted">${new Date(n.createdAt).toLocaleString("en-IN")}</div></div>${n.read?'<span class="status taken">Read</span>':`<button class="btn btn-small" onclick="markNotification('${n.id}')">Mark read</button>`}</div></div>`).join(""):"<div class='card'><p class='muted'>No notifications.</p></div>";}document.getElementById("markAll").onclick=()=>markAllNotifications(u.id);render();});
</script>
</head><body>
<header class="topbar"><div class="btn-row"><button class="icon-btn mobile-menu">☰</button><a class="brand" href="../patient/dashboard.html">MedRemind<span>+</span></a></div><div class="top-actions"><span class="muted" data-user-name></span><button class="btn btn-small" onclick="logout()">Logout</button></div></header>
<div class="layout"><aside class="sidebar">
    <div class="nav-title">Patient</div>
    <nav class="nav">
      <a href="../patient/dashboard.html">Dashboard</a>
      <a href="../patient/medicines.html">My Medicines</a>
      <a href="../patient/history.html">Medication History</a>
      <a href="../patient/adherence.html">Adherence</a>
      <a href="../patient/notifications.html">Notifications</a>
      <a href="../patient/profile.html">Profile & Settings</a>
    </nav></aside><main class="main">
<div class="page-head"><div><h1>Notifications</h1><div class="muted">Reminder and activity messages.</div></div><button id="markAll" class="btn">Mark all as read</button></div>
<div id="notes" class="med-list"></div>
</main></div>
<script>document.addEventListener("DOMContentLoaded",()=>{const u=currentUser();document.querySelectorAll("[data-user-name]").forEach(e=>e.textContent=u?.name||"");});</script>
</body></html>
